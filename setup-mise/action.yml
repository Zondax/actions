name: 'Setup mise'
description: 'Canonical mise bootstrap for Zondax composites (jdx/mise-action + PATH/shims)'
branding:
  icon: 'download'
  color: 'purple'

inputs:
  version:
    description: 'mise CLI version pin (empty = latest from mise-action)'
    required: false
    default: ''
  cache:
    description: 'Enable mise-action cache'
    required: false
    default: 'true'
  install:
    description: 'Run mise install for project mise.toml (usually false for composites that install tools themselves)'
    required: false
    default: 'false'
  install_args:
    description: 'Arguments forwarded to mise install, e.g. rust or --force rust github:casey/just'
    required: false
    default: ''
  reshim:
    description: 'Run mise reshim after install'
    required: false
    default: 'true'
  github_token:
    description: 'Token for GitHub-hosted mise tools (rate limits / private repos)'
    required: false
    default: ${{ github.token }}
  experimental:
    description: 'Enable mise experimental features'
    required: false
    default: 'false'

outputs:
  cache_hit:
    description: 'Whether the mise-action cache was hit'
    value: ${{ steps.mise.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    # mise-action downloads mise with a bare `curl -fsSL` and never retries.
    # Give that curl a config of its own: retry transient failures, and on
    # Windows let Schannel go on when the CA's revocation server does not
    # answer (CRYPT_E_REVOCATION_OFFLINE). A certificate that is revoked is
    # still refused.
    - name: Configure curl for the mise download
      id: curl
      shell: bash
      run: |
        set -euo pipefail
        dir="${RUNNER_TEMP}/setup-mise-curl"
        mkdir -p "$dir"
        {
          echo 'retry = 3'
          echo 'retry-all-errors'
          if [[ "$RUNNER_OS" == Windows ]]; then
            echo 'ssl-revoke-best-effort'
          fi
        } > "$dir/.curlrc"
        # Older Windows builds of curl only look for `_curlrc`.
        cp "$dir/.curlrc" "$dir/_curlrc"
        echo "home=$dir" >> "$GITHUB_OUTPUT"

    - name: Install mise
      id: mise
      uses: jdx/mise-action@e6a8b3978addb5a52f2b4cd9d91eafa7f0ab959d # v4.2.0
      env:
        CURL_HOME: ${{ steps.curl.outputs.home }}
      with:
        version: ${{ inputs.version }}
        cache: ${{ inputs.cache }}
        install: ${{ inputs.install }}
        install_args: ${{ inputs.install_args }}
        github_token: ${{ inputs.github_token }}
        experimental: ${{ inputs.experimental }}
        add_shims_to_path: true
        reshim: ${{ inputs.reshim }}

    - name: Ensure mise shims on PATH
      shell: bash
      run: |
        set -euo pipefail
        # Defense in depth: mise-action usually exports these; keep self-hosted runners honest.
        for dir in \
          "${HOME}/.local/share/mise/shims" \
          "${XDG_DATA_HOME:-}/mise/shims" \
          "${MISE_DATA_DIR:-}/shims" \
          "${HOME}/.local/bin"
        do
          if [[ -n "$dir" && -d "$dir" ]]; then
            echo "$dir" >> "$GITHUB_PATH"
          fi
        done
        command -v mise >/dev/null
        mise --version
