name: 'Sign Windows Binary (Authenticode via GCP KMS)'
description: >
  Authenticode-sign a PE binary (x64 or arm64) with jsign + a GCP Cloud KMS key.
  Runs on the Linux runner where Windows targets are cross-built (cargo-xwin).
  Caller provides a GCP access token from gcp-wif-auth (token_format: access_token).

inputs:
  binary_path:
    description: 'Path to the .exe. Alias: binary-path'
    required: false
    default: ''
  binary-path:
    description: 'Deprecated alias for binary_path'
    required: false
    default: ''
  gcp_access_token:
    description: 'GCP access token (gcp-wif-auth output). Alias: gcp-access-token'
    required: false
    default: ''
  gcp-access-token:
    description: 'Deprecated alias for gcp_access_token'
    required: false
    default: ''
  kms_keyring:
    description: 'KMS keyring. Alias: kms-keyring'
    required: false
    default: ''
  kms-keyring:
    description: 'Deprecated alias for kms_keyring'
    required: false
    default: ''
  kms_key_alias:
    description: 'KMS key alias. Alias: kms-key-alias'
    required: false
    default: ''
  kms-key-alias:
    description: 'Deprecated alias for kms_key_alias'
    required: false
    default: ''
  cert_chain:
    description: 'PKCS7 EV cert chain PEM. Alias: cert-chain'
    required: false
    default: ''
  cert-chain:
    description: 'Deprecated alias for cert_chain'
    required: false
    default: ''
  jsign_version:
    description: 'jsign version. Alias: jsign-version'
    required: false
    default: '7.4'
  jsign-version:
    description: 'Deprecated alias for jsign_version'
    required: false
    default: ''
  jsign_sha256:
    description: 'Expected sha256 of the jsign jar. Alias: jsign-sha256'
    required: false
    default: ''
  jsign-sha256:
    description: 'Deprecated alias for jsign_sha256'
    required: false
    default: ''
  tsa_url:
    description: 'RFC3161 TSA URL. Alias: tsa-url'
    required: false
    default: 'http://ts.ssl.com'
  tsa-url:
    description: 'Deprecated alias for tsa_url'
    required: false
    default: ''

outputs:
  os_code_signature:
    description: 'Compact JSON metadata'
    value: ${{ steps.sign.outputs.os_code_signature }}
  os-code-signature:
    description: 'Deprecated alias for os_code_signature'
    value: ${{ steps.sign.outputs.os_code_signature }}

runs:
  using: 'composite'
  steps:
    - name: Resolve inputs
      id: args
      shell: bash
      env:
        BINARY_PATH: ${{ inputs.binary_path }}
        BINARY_PATH_L: ${{ inputs['binary-path'] }}
        KEYRING: ${{ inputs.kms_keyring }}
        KEYRING_L: ${{ inputs['kms-keyring'] }}
        ALIAS: ${{ inputs.kms_key_alias }}
        ALIAS_L: ${{ inputs['kms-key-alias'] }}
        JSIGN_V: ${{ inputs.jsign_version }}
        JSIGN_V_L: ${{ inputs['jsign-version'] }}
        JSIGN_SHA: ${{ inputs.jsign_sha256 }}
        JSIGN_SHA_L: ${{ inputs['jsign-sha256'] }}
        TSA: ${{ inputs.tsa_url }}
        TSA_L: ${{ inputs['tsa-url'] }}
      run: |
        set -euo pipefail
        pick() { [[ -n "$1" ]] && echo "$1" || echo "$2"; }
        pick_def() { local v; v="$(pick "$1" "$2")"; [[ -n "$v" ]] && echo "$v" || echo "$3"; }
        BINARY="$(pick "$BINARY_PATH" "$BINARY_PATH_L")"
        KEYRING_V="$(pick "$KEYRING" "$KEYRING_L")"
        ALIAS_V="$(pick "$ALIAS" "$ALIAS_L")"
        JSIGN_VER="$(pick_def "$JSIGN_V" "$JSIGN_V_L" "7.4")"
        JSIGN_SUM="$(pick "$JSIGN_SHA" "$JSIGN_SHA_L")"
        TSA_V="$(pick_def "$TSA" "$TSA_L" "http://ts.ssl.com")"
        for name in BINARY KEYRING_V ALIAS_V; do
          if [[ -z "${!name}" ]]; then
            echo "::error::Missing required input ($name)"
            exit 1
          fi
        done
        {
          echo "binary_path=$BINARY"
          echo "kms_keyring=$KEYRING_V"
          echo "kms_key_alias=$ALIAS_V"
          echo "jsign_version=$JSIGN_VER"
          echo "jsign_sha256=$JSIGN_SUM"
          echo "tsa_url=$TSA_V"
        } >> "$GITHUB_OUTPUT"

    - name: Set up JRE for jsign
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '21'

    - name: Sign (Authenticode)
      id: sign
      shell: bash
      env:
        BINARY_PATH: ${{ steps.args.outputs.binary_path }}
        GCP_ACCESS_TOKEN: ${{ inputs.gcp_access_token != '' && inputs.gcp_access_token || inputs['gcp-access-token'] }}
        KMS_KEYRING: ${{ steps.args.outputs.kms_keyring }}
        KMS_KEY_ALIAS: ${{ steps.args.outputs.kms_key_alias }}
        CERT_CHAIN: ${{ inputs.cert_chain != '' && inputs.cert_chain || inputs['cert-chain'] }}
        JSIGN_VERSION: ${{ steps.args.outputs.jsign_version }}
        JSIGN_SHA256: ${{ steps.args.outputs.jsign_sha256 }}
        TSA_URL: ${{ steps.args.outputs.tsa_url }}
      run: |
        set -euo pipefail
        if [[ -z "${GCP_ACCESS_TOKEN:-}" ]]; then
          echo "::error::gcp_access_token (or gcp-access-token) is required"
          exit 1
        fi
        if [[ -z "${CERT_CHAIN:-}" ]]; then
          echo "::error::cert_chain (or cert-chain) is required"
          exit 1
        fi
        JAR="$RUNNER_TEMP/jsign.jar"
        CHAIN="$RUNNER_TEMP/codesign-chain.p7b"
        curl -fSL "https://github.com/ebourg/jsign/releases/download/${JSIGN_VERSION}/jsign-${JSIGN_VERSION}.jar" -o "$JAR"
        if [ -n "$JSIGN_SHA256" ]; then
          echo "${JSIGN_SHA256}  $JAR" | sha256sum -c - || { echo "::error::jsign sha256 mismatch"; exit 1; }
        else
          echo "::warning::jsign_sha256 not pinned"
        fi
        printf '%s\n' "$CERT_CHAIN" > "$CHAIN"
        java -jar "$JAR" \
          --storetype GOOGLECLOUD \
          --storepass "$GCP_ACCESS_TOKEN" \
          --keystore "$KMS_KEYRING" \
          --alias "$KMS_KEY_ALIAS" \
          --certfile "$CHAIN" \
          --tsaurl "$TSA_URL" --tsmode RFC3161 \
          "$BINARY_PATH"
        SIGNER=$(openssl pkcs7 -in "$CHAIN" -print_certs -noout 2>/dev/null | grep 'subject=' | head -1 | sed 's/.*O = //; s/,.*//' || echo "Zondax AG")
        SIGNER_ESC="${SIGNER//\"/\\\"}"
        echo "os_code_signature={\"type\":\"authenticode\",\"signer\":\"${SIGNER_ESC}\"}" >> "$GITHUB_OUTPUT"

    - name: Cleanup
      if: always()
      shell: bash
      run: rm -f "$RUNNER_TEMP/jsign.jar" "$RUNNER_TEMP/codesign-chain.p7b"
