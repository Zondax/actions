name: Setup runner

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-runner
      - name: Verify
        run: |
          set -euo pipefail
          for tool in cc c++ make clang cmake ninja pkg-config nasm wget; do
            command -v "$tool"
          done

  windows:
    name: Windows
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-runner
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          for tool in cc c++ make nasm clang clang-cl pwsh; do
            command -v "$tool"
          done

  # Hosted Windows ships a permissive ExecutionPolicy, so the job above cannot
  # tell whether this action survives a locked-down runner. Self-hosted boxes
  # are often Restricted, which used to kill the action at its first step. Lock
  # the policy for this user, then run the action for real.
  windows-restricted:
    name: Windows (ExecutionPolicy Restricted)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Restrict script execution
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-ExecutionPolicy -Scope CurrentUser -ExecutionPolicy Restricted -Force
          Get-ExecutionPolicy -List
      - uses: ./setup-runner
      - name: Verify
        shell: bash
        run: |
          set -euo pipefail
          for tool in cc c++ make nasm clang clang-cl pwsh; do
            command -v "$tool"
          done

  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-runner
      - name: Verify
        run: command -v cc
