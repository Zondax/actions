name: Node.js Action

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '0 1 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-node-environment:
    name: Node ${{ matrix.node_version }} | ${{ matrix.package_manager }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Node 20 is EOL — do not re-add. 22 = Maintenance LTS, 24 = recommended.
        node_version: ['22', '24']
        package_manager: [npm, yarn, pnpm, bun]
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node_version }} with ${{ matrix.package_manager }}
        id: setup-node
        uses: ./setup-node-env
        with:
          node_version: ${{ matrix.node_version }}
          package_manager: ${{ matrix.package_manager }}
          install_deps: false
          autoinit_env: false

      - name: Verify Installation
        run: |
          set -euo pipefail
          node_version=$(node --version)
          echo "Node.js: $node_version"
          [[ "$node_version" == v${{ matrix.node_version }}.* ]] || exit 1
          case "${{ matrix.package_manager }}" in
            npm)  npm --version  ;;
            yarn) yarn --version ;;
            pnpm) pnpm --version ;;
            bun)  bun --version  ;;
          esac
          echo "✅ Node.js ${{ matrix.node_version }} + ${{ matrix.package_manager }} working!"

  test-setup-mise:
    name: setup-mise smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./setup-mise
      - run: mise --version
