name: 'GCP Workload Identity Federation Authentication'
description: 'Authenticate with Google Cloud using Workload Identity Federation with optional JWT debugging'
branding:
  icon: 'cloud'
  color: 'blue'

inputs:
  workload_identity_provider:
    description: 'Workload Identity Provider resource name'
    required: true
  project_id:
    description: 'GCP Project ID'
    required: false
    default: ''
  service_account:
    description: 'Service account email to impersonate (empty = direct principal-set WIF when allowed)'
    required: false
    default: ''
  setup_gcloud:
    description: 'Install and configure gcloud SDK'
    required: false
    default: 'true'
  gcloud_version:
    description: 'gcloud SDK version (prefer a pin over latest in production)'
    required: false
    default: '519.0.0'
  gcloud_components:
    description: 'Additional gcloud components to install (comma-separated)'
    required: false
    default: ''
  log_jwt_info:
    description: 'Reserved for future JWT debug output (currently unused; kept for API stability)'
    required: false
    default: 'false'
  verify_authentication:
    description: 'Verify authentication by running gcloud commands'
    required: false
    default: 'true'
  export_credentials:
    description: 'Export credentials to environment via google-github-actions/auth'
    required: false
    default: 'true'
  token_format:
    description: 'Token format from google-github-actions/auth (empty | access_token | id_token). Required for access_token output.'
    required: false
    default: ''
  create_credentials_file:
    description: "Whether auth writes an ADC credentials file (true/false). Pass 'false' for token-only flows."
    required: false
    default: 'true'

outputs:
  credentials_path:
    description: 'Path to the generated credentials file'
    value: ${{ steps.auth.outputs.credentials_file_path }}
  access_token:
    description: 'Access token for authenticated requests'
    value: ${{ steps.auth.outputs.access_token }}
  project_id:
    description: 'GCP Project ID'
    value: ${{ steps.auth.outputs.project_id }}

runs:
  using: 'composite'
  steps:
    # Single auth step: empty project_id / service_account are treated as unset by the upstream action.
    - name: Authenticate with Google Cloud
      id: auth
      uses: google-github-actions/auth@v2
      with:
        workload_identity_provider: ${{ inputs.workload_identity_provider }}
        project_id: ${{ inputs.project_id }}
        service_account: ${{ inputs.service_account }}
        token_format: ${{ inputs.token_format }}
        create_credentials_file: ${{ inputs.create_credentials_file }}
        export_environment_variables: ${{ inputs.export_credentials }}

    - name: Set up Google Cloud SDK
      if: inputs.setup_gcloud == 'true'
      uses: google-github-actions/setup-gcloud@v3
      with:
        version: ${{ inputs.gcloud_version }}
        install_components: ${{ inputs.gcloud_components }}

    - name: Verify GCP Authentication
      if: inputs.verify_authentication == 'true'
      shell: bash
      env:
        SERVICE_ACCOUNT: ${{ inputs.service_account }}
      run: |
        set -euo pipefail
        echo "Checking GCP Authentication..."
        echo "Authenticated accounts:"
        gcloud auth list --format="table(status,account)" 2>/dev/null || echo "No authenticated accounts found"

        PROJECT="$(gcloud config get-value project 2>/dev/null || true)"
        if [[ -n "$PROJECT" && "$PROJECT" != "(unset)" ]]; then
          echo "Current project: $PROJECT"
        else
          echo "No project configured"
        fi

        if [[ -n "$SERVICE_ACCOUNT" ]]; then
          echo "Service account input: $SERVICE_ACCOUNT"
        fi
        # Diagnostic only
        exit 0
