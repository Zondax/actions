name: 'Sign Linux Binary (KMS OpenPGP)'
description: 'WIF auth, install kunobi-pgp-kms, materialize the OpenPGP cert, and produce an armored detached signature backed by GCP KMS.'
inputs:
  target-path: {description: 'File to sign (e.g. the .tar.gz archive)', required: true}
  workload-identity-provider: {description: 'WIF provider (vars.PGP_SIGN_WIF_PROVIDER)', required: true}
  gcp-project-id: {description: 'GCP project (vars.PGP_SIGN_GCP_PROJECT_ID)', required: true}
  service-account: {description: 'SA to impersonate; empty = direct principal-set', required: false, default: ''}
  signer-token: {description: 'Token with read on private kunobi-ninja/kunobi-pgp-kms (App installation token or PAT)', required: true}
  kms-key: {description: 'KMS key version path (vars.PGP_SIGN_KMS_KEY_VERSION)', required: true}
  cert-base64: {description: 'Base64 OpenPGP public cert (secrets.PGP_CERT_BASE64)', required: true}
  signer-version: {description: 'kunobi-pgp-kms tag', required: false, default: 'latest'}
outputs:
  signature-path: {description: 'Path to the .asc', value: '${{ steps.sign.outputs.signature-path }}'}
  cert-fingerprint: {description: 'OpenPGP V4 fingerprint', value: '${{ steps.cert.outputs.fingerprint }}'}
runs:
  using: 'composite'
  steps:
    - name: Authenticate with GCP (WIF)
      uses: zondax/actions/gcp-wif-auth@v1
      with:
        workload_identity_provider: ${{ inputs.workload-identity-provider }}
        project_id: ${{ inputs.gcp-project-id }}
        service_account: ${{ inputs.service-account }}
    - name: Install kunobi-pgp-kms via mise
      shell: bash
      env: {VERSION: '${{ inputs.signer-version }}', MISE_GITHUB_TOKEN: '${{ inputs.signer-token }}'}
      run: |
        set -euo pipefail   # never add `set -x` here (would echo token)
        if ! command -v mise >/dev/null; then
          curl -fsSL https://mise.jdx.dev/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"; export PATH="$HOME/.local/bin:$PATH"
        fi
        mise use --global "github:kunobi-ninja/kunobi-pgp-kms@${VERSION#v}"
        mise reshim
        echo "$HOME/.local/share/mise/shims" >> "$GITHUB_PATH"
        export PATH="$HOME/.local/share/mise/shims:$PATH"
        kunobi-pgp-kms --version
    - name: Materialize OpenPGP cert
      id: cert
      shell: bash
      env: {CERT_B64: '${{ inputs.cert-base64 }}'}
      run: |
        set -euo pipefail
        CERT_PATH="$RUNNER_TEMP/signer.pub.asc"
        printf '%s' "$CERT_B64" | base64 -d > "$CERT_PATH"
        grep -q 'BEGIN PGP PUBLIC KEY BLOCK' "$CERT_PATH" || { echo "::error::invalid PGP cert"; exit 1; }
        FPR=$(gpg2 --with-colons --show-keys "$CERT_PATH" | awk -F: '/^fpr/{print $10; exit}')
        [ -z "$FPR" ] && { echo "::error::Could not extract fingerprint from $CERT_PATH"; exit 1; }
        echo "fingerprint: $FPR"
        echo "path=$CERT_PATH" >> "$GITHUB_OUTPUT"; echo "fingerprint=$FPR" >> "$GITHUB_OUTPUT"
    - name: Detached-sign the archive
      id: sign
      shell: bash
      env: {TARGET_PATH: '${{ inputs.target-path }}', CERT_PATH: '${{ steps.cert.outputs.path }}', KMS_KEY: '${{ inputs.kms-key }}'}
      run: |
        set -euo pipefail
        SIG="${TARGET_PATH}.asc"
        kunobi-pgp-kms detach-sign --kms-key "$KMS_KEY" --cert "$CERT_PATH" --in "$TARGET_PATH" --out "$SIG"
        kunobi-pgp-kms verify --cert "$CERT_PATH" --sig "$SIG" --data "$TARGET_PATH"
        echo "signature-path=$SIG" >> "$GITHUB_OUTPUT"
